<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift</title>
    <style>
      /* Minimal reset so the canvas fills the window with no scrollbars. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      #hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: #8fa3b8;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-align: center;
        opacity: 1;
        transition: opacity 0.6s ease;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">
      CLICK TO LOOK &nbsp;·&nbsp; WASD MOVE &nbsp;·&nbsp; SPACE / SHIFT UP &amp; DOWN &nbsp;·&nbsp;
      E INTERACT &nbsp;·&nbsp; V EXTERIOR VIEW IN FLIGHT
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
